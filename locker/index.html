<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הלוקר של הנשיא</title>
<meta name="description" content="הלוקר של שבט הנשיא: פותחים ארגזים ואוספים את כל הבגדים והציוד מקטלוג השבט. ככל שהפריט ישן יותר הוא נדיר יותר.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="locker.css?v=7">
</head>
<body>

<header class="top">
  <a class="back" href="../#games" aria-label="חזרה לאתר השבט">→ <span>לאתר</span></a>
  <div class="brand"><b>הלוקר</b><span>שבט הנשיא</span></div>
  <div class="wallet">
    <button class="chip coin" id="wCoins" title="אסימונים: אסימון על כל 25 נקודות פנאט במשחקים"><i class="ic-coin"></i><b>0</b></button>
    <button class="chip crate" id="wCrates" title="ארגזים שמחכים לפתיחה"><i class="ic-crate"></i><b>0</b></button>
    <button class="chip snd" id="sndBtn" aria-pressed="true" title="צליל">צליל</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-v="crates" class="on">ארגזים<em id="crBadge" hidden></em></button>
  <button role="tab" data-v="col">האוסף</button>
</nav>

<main>
  <!-- ===== CRATES ===== -->
  <section class="view on" id="v-crates">
    <h2>ארגזים</h2>
    <div class="daily" id="daily"></div>
    <div class="crates" id="crateList"></div>
    <div class="earn">
      <h3>איך משיגים עוד?</h3>
      <ul>
        <li><b>משחקים באתר השבט:</b> כל 25 נקודות פנאט שוות אסימון אחד.</li>
        <li><b>ארגז יומי:</b> ארגז מחסן חינם כל יום.</li>
        <li><b>כפולים:</b> פריטים כפולים מוכרים באוסף תמורת אסימונים. פריט ישן יותר שווה יותר.</li>
      </ul>
      <a class="btn" href="../#games">למשחקי השבט ←</a>
    </div>
  </section>

  <!-- ===== COLLECTION ===== -->
  <section class="view" id="v-col">
    <h2>האוסף</h2>
    <div class="col-head">
      <div class="prog">
        <div class="pnum"><b id="colNum">0</b><span>/ <i id="colTot">0</i> נאספו</span></div>
        <div class="pbar big"><i id="colBar"></i></div>
      </div>
      <div class="rbars" id="rarBars"></div>
    </div>
    <div class="filters">
      <div class="seg" id="ownSeg"><button data-o="1" class="on">מה שיש לי</button><button data-o="0">כל הקטלוג</button></div>
      <button class="btn ghost sell" id="sellDupes" hidden></button>
    </div>
    <div class="chips" id="cats"></div>
    <div id="colList"></div>
  </section>
</main>

<!-- overlays -->
<div class="ov" id="ovOpen" hidden>
  <div class="op-bg"><i class="op-rays"></i></div>
  <div class="op-crate" id="opCrate"></div>
  <div class="multi" id="multi" hidden></div>
  <div class="reel-wrap" id="reelWrap" hidden><div class="reel" id="reel"></div><i class="reel-mark"></i></div>
  <div class="win" id="win" hidden></div>
  <i class="op-flash" id="opFlash"></i>
  <button class="op-skip" id="opSkip">דלגו</button>
</div>
<div class="ov" id="ovInspect" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script src="items.js?v=6"></script>
<script src="locker.js?v=9"></script>
</body>
</html>
